services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: test-admin
      MINIO_ROOT_PASSWORD: test-password
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
