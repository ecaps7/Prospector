name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector
          POSTGRES_DB: prospector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prospector -d prospector"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://prospector:prospector@localhost:5432/prospector
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: prospector
      PROSPECTOR_API_TOKEN: ci-token

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Unit tests
        run: uv run pytest tests/unit -q

      - name: Ensure MinIO bucket
        run: |
          pip install minio
          python - <<'PY'
          from minio import Minio
          c = Minio("localhost:9000", access_key="minioadmin", secret_key="minioadmin", secure=False)
          if not c.bucket_exists("prospector"):
              c.make_bucket("prospector")
          PY

      - name: Migrate + checkpointer setup
        run: |
          uv run alembic upgrade head
          uv run prospector-local setup

      - name: Integration tests
        run: uv run pytest tests/integration -q -m integration
