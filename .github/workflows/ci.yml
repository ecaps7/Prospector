name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://prospector:prospector@localhost:5432/prospector
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: prospector
      PROSPECTOR_API_TOKEN: ci-token

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run basedpyright

      - name: Unit tests
        run: uv run pytest tests/unit -q -m "not live"

      - name: Start integration services
        run: docker compose up -d --wait postgres minio minio-init

      - name: Migrate + checkpointer setup
        run: |
          uv run alembic upgrade head
          uv run prospector-local setup

      - name: Integration tests
        run: uv run pytest tests/integration -q -m "integration and not live"
